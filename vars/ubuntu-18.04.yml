---
# Ubuntu 18.04 (bionic) - uses python2 packages
duploy_packages:
  - duply
  - python-paramiko
  - python-boto
  - lftp
  - ftp

# No pip packages needed
duply_pip_packages: []

# duply install method
duply_install_method: package

# cronic is available as a package on Ubuntu
duply_cronic_install_method: package
