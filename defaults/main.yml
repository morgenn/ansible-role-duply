---
# @var duply_profiles:description: List of profile definitions
# @var duply_profiles:example: >
# duply_profiles:
#   - name: owncloud
#     includes:
#       - /var/lib/owncloud
#   - name: external
#     target: ftp://username:p455w0rd@ftp.example.com
#     ansible.builtin.command: full+verify+purge --force
#     gpg_key: 52DCE5AE1FC80340A33894F5D583668622CDE10E
#     gpg_passwd: p455w0rd
#     max_age: 1W
#     max_full: '7'
#     verbosity: '1'
#     minute: '0'
#     hour: '5'
#     day: '*'
#     month: '*'
#     weekday: '*'
#     includes:
#       - /var/lib/foo
#       - /var/lib/bar
# @end
duply_profiles: []

# @var duply_target:description: Target for backups
# @var duply_target:example: s3://backup.example.com
duply_target:

# @var duply_default_gpg_key:description: Default GnuPG key
duply_default_gpg_key: disabled

# @var duply_default_gpg_passwd:description: Default GnuPG password
duply_default_gpg_passwd:

# @var duply_default_gpg_opts:description: Default GnuPG options
duply_default_gpg_opts: --pinentry-mode loopback

# @var duply_default_minute:description: Default minute cron entry
duply_default_minute: '5'

# @var duply_default_hour:description: Default hour cron entry
duply_default_hour: '5'

# @var duply_default_day:description: Default day cron entry
duply_default_day: '*'

# @var duply_default_month:description: Default month cron entry
duply_default_month: '*'

# @var duply_default_weekday:description: Default weekday cron entry
duply_default_weekday: '*'

# @var duply_default_command:description: Default backup command
duply_default_command: full+purgeFull --force

# @var duply_default_max_age:description: Default max age
duply_default_max_age: 2W

# @var duply_default_max_full:description: Default max full backup sets to keep
duply_default_max_full: '2'

# @var duply_default_max_fullbkp_age:description: Max age before forcing a new full backup
# When running 'incr', if the last full is older than this, a full is done instead.
duply_default_max_fullbkp_age: 1W

# @var duply_default_verbosity:description: Default verbosity level
duply_default_verbosity: '1'

# @var duply_default_volsize:description: Default volume size
duply_default_volsize: '1024'

# @var duply_default_temp_dir:description: Temp directory for duplicity archive assembly
# Set to a path with enough free space (backup needs ~1x source size as temp).
# Empty string uses system /tmp.
duply_default_temp_dir: /var/tmp/

# @var duply_default_variables:description: Default variables list
# @var duply_default_variables:example: >
# duply_default_variables:
#   - key: aws_access_key_id
#     value: S62L74JZVLLKQ5E9077R
#   - key: aws_secret_access_key
#     value: xmGiLiTMBGzMMwRh+jAYBvn9C7roiuDqVHDF_+RI
# @end
duply_default_variables: []

# @var duply_pip_packages:description: Python packages to install via pip (for platforms without native packages)
duply_pip_packages: []

# @var duply_install_method:description: How to install duply - 'package' (dnf/apt) or 'source' (download script)
duply_install_method: package

# @var duply_source_url:description: URL to download duply source tarball (when duply_install_method is 'source')
duply_source_url: "https://sourceforge.net/projects/ftplicity/files/duply%20%28simple%20duplicity%29/2.5.x/duply_2.5.1.tgz/download"

# @var duply_source_fallback_url:description: >
#   Fallback URL if the primary (SourceForge) times out. Set to a mirror, S3 bucket,
#   or empty string to disable. SourceForge is notoriously unreliable during builds.
duply_source_fallback_url: ""

# @var duply_source_version:description: Version string for duply source install (used for idempotency check)
duply_source_version: "2.5.1"

# @var duply_log_dir:description: Directory for backup log files (set empty to disable logging)
duply_log_dir: /var/log/duply

# @var duply_use_cronic:description: Wrap backup command with cronic (emails on failure only)
duply_use_cronic: true

# @var duply_efs_sync_dest:description: >
#   EFS destination to rsync backup archives after completion.
#   Set to empty string to disable post-backup EFS sync.
#   Only incremental changes are transferred (rsync is efficient).
# @end
duply_efs_sync_dest: ''

# @var duply_efs_cleanup_days:description: >
#   Delete backup archives on EFS older than this many days.
#   Runs weekly (Sunday 4am) to clean up orphaned files from purged backup sets.
#   Set to 0 to disable cleanup.
# @end
duply_efs_cleanup_days: 30

# @var duply_nice_prefix:description: >
#   Command prefix to limit CPU and I/O priority of backup jobs.
#   Ensures web services (apache, varnish, php-fpm) always get priority.
#   - nice -n 19: lowest CPU scheduling priority
#   - ionice -c3: idle I/O class (only uses disk when nothing else needs it)
#   Set to empty string to disable resource limiting.
# @end
duply_nice_prefix: 'nice -n 19 ionice -c3'

# @var duply_cron_job_template:description: >
#   Jinja2 template string for the cron job command. Available variables:
#   - duply_bin_path: path to duply binary
#   - duply_log_dir: log directory path
#   - duply_nice_prefix: CPU/IO priority prefix
#   - duply_efs_sync_dest: EFS sync destination (empty to disable)
#   - item.name: profile name
#   - item.command / duply_default_command: backup command
#   Override this to customize logging, wrappers, or output handling.
# @end
duply_cron_job_template: >-
  {% if duply_log_dir | default('') | length > 0 -%}
  { echo ""; echo "═══ START $(date '+\%Y-\%m-\%d \%H:\%M:\%S') {{ item.name }} ═══"; {{ duply_nice_prefix }} {{ duply_bin_path | default('/usr/local/bin/duply') }} {{ item.name }} {{ item.command | default(duply_default_command) }} 2>&1; RC=$?; if [ $RC -ne 0 ]; then echo "[FAILED] exit $RC"; fi;{% if duply_efs_sync_dest | default('') | length > 0 %} if [ $RC -eq 0 ]; then echo "Syncing to EFS..."; {{ duply_nice_prefix }} rsync -a /backup/duplicity/{{ item.name }}/ {{ duply_efs_sync_dest }}/{{ item.name }}/ 2>&1; echo "EFS sync complete."; fi;{% endif %} echo "═══ END   $(date '+\%Y-\%m-\%d \%H:\%M:\%S') {{ item.name }} (exit $RC) ═══"; (exit $RC); } >> {{ duply_log_dir }}/{{ item.name }}.log 2>&1
  {%- elif duply_use_cronic | default(true) -%}
  cronic {{ duply_nice_prefix }} {{ duply_bin_path | default('/usr/local/bin/duply') }} {{ item.name }} {{ item.command | default(duply_default_command) }}
  {%- else -%}
  {{ duply_nice_prefix }} {{ duply_bin_path | default('/usr/local/bin/duply') }} {{ item.name }} {{ item.command | default(duply_default_command) }}
  {%- endif %}

# @var duply_bin_path:description: Path where duply binary is installed
duply_bin_path: /usr/local/bin/duply

# @var duply_install_cronic:description: Whether to install cronic (cron error wrapper)
duply_install_cronic: true

# @var duply_cronic_install_method:description: How to install cronic - 'package' (apt) or 'source' (git clone)
# Ubuntu has cronic as a package; AL2023/RHEL do not.
duply_cronic_install_method: source

# @var duply_cronic_repo:description: Git repo URL for cronic source install
duply_cronic_repo: "https://github.com/justincase/cronic.git"

# @var duply_cronic_src_path:description: Local path to clone cronic source
duply_cronic_src_path: /opt/umac/src/cronic

...
