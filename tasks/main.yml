---
- name: Include OS vars
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution | lower }}-{{ ansible_distribution_version }}.yml"
    - "{{ ansible_distribution | lower }}.yml"
    - "{{ ansible_os_family | lower }}.yml"
  tags:
    - duply

- name: Install required packages
  loop: "{{ duploy_packages }}"
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  tags:
    - duply

- name: Install pip packages (for platforms without native duplicity)
  loop: "{{ duply_pip_packages | default([]) }}"
  ansible.builtin.pip:
    name: "{{ item }}"
    state: present
  when: duply_pip_packages | default([]) | length > 0
  tags:
    - duply

# Install cronic (cron error reporting wrapper) if not already available.
# On Ubuntu it's a package; on AL2023/RHEL it's a single-file script from git.
- name: Check if cronic is available
  ansible.builtin.command: which cronic
  register: cronic_check
  changed_when: false
  failed_when: false
  when: duply_install_cronic | default(true)
  tags:
    - duply

- name: Install cronic from package manager
  ansible.builtin.package:
    name: cronic
    state: present
  when:
    - duply_install_cronic | default(true)
    - cronic_check.rc != 0
    - duply_cronic_install_method | default('source') == 'package'
  failed_when: false
  tags:
    - duply

- name: Clone cronic repository (when not available as package)
  ansible.builtin.git:
    repo: "{{ duply_cronic_repo | default('https://github.com/justincase/cronic.git') }}"
    dest: "{{ duply_cronic_src_path | default('/opt/umac/src/cronic') }}"
    update: false
  when:
    - duply_install_cronic | default(true)
    - cronic_check.rc != 0
    - duply_cronic_install_method | default('source') == 'source'
  tags:
    - duply

- name: Ensure cronic is executable
  ansible.builtin.file:
    path: "{{ duply_cronic_src_path | default('/opt/umac/src/cronic') }}/cronic"
    mode: '0755'
  when:
    - duply_install_cronic | default(true)
    - cronic_check.rc != 0
    - duply_cronic_install_method | default('source') == 'source'
  tags:
    - duply

- name: Create cronic symlinks
  ansible.builtin.file:
    src: "{{ duply_cronic_src_path | default('/opt/umac/src/cronic') }}/cronic"
    dest: "{{ item }}/cronic"
    state: link
  loop:
    - /usr/bin
    - /usr/local/bin
  when:
    - duply_install_cronic | default(true)
    - cronic_check.rc != 0
    - duply_cronic_install_method | default('source') == 'source'
  tags:
    - duply

# Install duply from source when not available as a system package (e.g., AL2023)
- name: Check if duply is already installed
  ansible.builtin.stat:
    path: "{{ duply_bin_path | default('/usr/local/bin/duply') }}"
  register: duply_bin_stat
  when: duply_install_method | default('package') == 'source'
  tags:
    - duply

- name: Check installed duply version
  ansible.builtin.command: "{{ duply_bin_path | default('/usr/local/bin/duply') }} --version"
  register: duply_installed_version
  changed_when: false
  failed_when: false
  when:
    - duply_install_method | default('package') == 'source'
    - duply_bin_stat.stat.exists | default(false)
  tags:
    - duply

- name: Create temp directory for duply source
  ansible.builtin.tempfile:
    state: directory
    prefix: duply_
  register: duply_temp_dir
  when:
    - duply_install_method | default('package') == 'source'
    - not (duply_bin_stat.stat.exists | default(false)) or
      (duply_source_version | default('') not in (duply_installed_version.stdout | default('')))
  tags:
    - duply

- name: Download duply source
  ansible.builtin.get_url:
    url: "{{ duply_source_url }}"
    dest: "{{ duply_temp_dir.path }}/duply.tgz"
    mode: '0644'
  when: duply_temp_dir.path is defined
  tags:
    - duply

- name: Extract duply source
  ansible.builtin.unarchive:
    src: "{{ duply_temp_dir.path }}/duply.tgz"
    dest: "{{ duply_temp_dir.path }}"
    remote_src: true
  when: duply_temp_dir.path is defined
  tags:
    - duply

- name: Install duply binary from source
  ansible.builtin.copy:
    src: "{{ duply_temp_dir.path }}/duply_{{ duply_source_version }}/duply"
    dest: "{{ duply_bin_path | default('/usr/local/bin/duply') }}"
    mode: '0755'
    remote_src: true
  when: duply_temp_dir.path is defined
  tags:
    - duply

- name: Clean up temp directory
  ansible.builtin.file:
    path: "{{ duply_temp_dir.path }}"
    state: absent
  when: duply_temp_dir.path is defined
  tags:
    - duply

# Profile management
- name: Create profile directory
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}"
  ansible.builtin.file:
    path: "/etc/duply/{{ item.name }}"
    mode: u=rwx,g=,o=
    state: "{{ 'directory' if item.state | default('present') == 'present' else 'absent' }}"
  tags:
    - duply

- name: Write config file
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}/conf"
  when:
    - ('present' if item.state is not defined else item.state) == "present"
  ansible.builtin.template:
    src: config.j2
    dest: "/etc/duply/{{ item.name }}/conf"
    mode: u=rw,g=,o=
  tags:
    - duply

- name: Delete config file
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}/conf"
  when:
    - ('present' if item.state is not defined else item.state) == "absent"
  ansible.builtin.file:
    path: "/etc/duply/{{ item.name }}/conf"
    state: absent
  tags:
    - duply

- name: Write exclude file
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}/exclude"
  when:
    - ('present' if item.state is not defined else item.state) == "present"
  ansible.builtin.template:
    src: exclude.j2
    dest: "/etc/duply/{{ item.name }}/exclude"
    mode: u=rw,g=,o=
  tags:
    - duply

- name: Delete exclude file
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}/exclude"
  when:
    - ('present' if item.state is not defined else item.state) == "absent"
  ansible.builtin.file:
    path: "/etc/duply/{{ item.name }}/exclude"
    state: absent
  tags:
    - duply

- name: Write pre file (inline content)
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}/pre"
  when:
    - item.pre | default('') | length > 0
    - item.pre_template is not defined
  ansible.builtin.copy:
    content: "{{ item.pre }}"
    dest: "/etc/duply/{{ item.name }}/pre"
    mode: u=rwx,g=,o=
  tags:
    - duply

- name: Write pre file (from template)
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}/pre"
  when:
    - item.pre_template is defined
    - item.pre_template | length > 0
    - ('present' if item.state is not defined else item.state) == "present"
  ansible.builtin.template:
    src: "{{ item.pre_template }}"
    dest: "/etc/duply/{{ item.name }}/pre"
    mode: u=rwx,g=,o=
  tags:
    - duply

- name: Delete pre file
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}/pre"
  when:
    - item.pre is not defined
    - item.pre_template is not defined
  ansible.builtin.file:
    path: "/etc/duply/{{ item.name }}/pre"
    state: absent
  tags:
    - duply

- name: Write post file (inline content)
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}/post"
  when:
    - item.post | default('') | length > 0
    - item.post_template is not defined
  ansible.builtin.copy:
    content: "{{ item.post }}"
    dest: "/etc/duply/{{ item.name }}/post"
    mode: u=rwx,g=,o=
  tags:
    - duply

- name: Write post file (from template)
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}/post"
  when:
    - item.post_template is defined
    - item.post_template | length > 0
    - ('present' if item.state is not defined else item.state) == "present"
  ansible.builtin.template:
    src: "{{ item.post_template }}"
    dest: "/etc/duply/{{ item.name }}/post"
    mode: u=rwx,g=,o=
  tags:
    - duply

- name: Delete post file
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "/etc/duply/{{ item.name }}/post"
  when:
    - item.post is not defined
    - item.post_template is not defined
  ansible.builtin.file:
    path: "/etc/duply/{{ item.name }}/post"
    state: absent
  tags:
    - duply

- name: Create cronjob entry
  loop: "{{ duply_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  ansible.builtin.cron:
    name: "backup {{ item.name }}"
    minute: "{{ item.minute | default(duply_default_minute) }}"
    hour: "{{ item.hour | default(duply_default_hour) }}"
    day: "{{ item.day | default(duply_default_day) }}"
    month: "{{ item.month | default(duply_default_month) }}"
    weekday: "{{ item.weekday | default(duply_default_weekday) }}"
    job: "cronic {{ duply_bin_path | default('/usr/local/bin/duply') }} {{ item.name }} {{ item.command | default(duply_default_command) }}"
    state: "{{ item.state | default('present') }}"
  tags:
    - duply

...
